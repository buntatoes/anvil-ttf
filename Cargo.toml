# SFNT (.ttf / .otf) parser, glyph outlines (glyf and CFF), kerning (kern and
# GPOS PairPos), vertical grid fitting, 4x4 coverage rasterizer, bold/italic
# synthesis, and linear-space alpha blending.
# Callers: anvil-layout (proportional text measurement) and anvil-raster
# (Linux and Windows glyphs when a system .ttf/.otf is found). Both crates are
# in anvil-engine. No bytecode hinting and no GPU atlas upload.

[package]
name = "anvil-ttf"
version = "0.10.0"
edition = "2024"
rust-version = "1.99.1"
authors = ["Buntato"]
license = "LicenseRef-PolyForm-Noncommercial-1.0.0-OR-Commercial"
description = "TrueType and OpenType parser, glyph outlines, and a coverage rasterizer."
repository = "https://github.com/buntatoes/anvil-ttf"
homepage = "https://github.com/buntatoes/anvil-ttf"
readme = "README.md"
keywords = ["truetype", "opentype", "font", "ttf"]
categories = ["parser-implementations", "rendering"]
publish = false
