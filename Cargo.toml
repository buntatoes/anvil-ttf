# SFNT parser, glyph outlines, and an 8-bit coverage rasterizer.
# Callers: flux-layout (text measurement) and flux-raster (Linux glyphs when
# a system .ttf is found). No hinting and no GPU atlas upload.

[package]
name = "flux-ttf"
version = "0.4.0"
edition = "2024"
authors = ["Buntos <324143321+buntatoes@users.noreply.github.com>"]
license = "MPL-2.0"
description = "TrueType and OpenType parser, glyph outlines, and a coverage rasterizer."
repository = "https://github.com/buntatoes/flux-ttf"
homepage = "https://github.com/buntatoes/flux-ttf"
readme = "README.md"
keywords = ["truetype", "opentype", "font", "ttf"]
categories = ["parser-implementations", "rendering"]
publish = false
