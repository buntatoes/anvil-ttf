# SFNT parser, glyph outlines, and an 8-bit coverage rasterizer.
# Callers: anvil-layout (text measurement) and anvil-raster (Linux glyphs when
# a system .ttf is found). Both crates are in anvil-engine.
# No hinting and no GPU atlas upload.

[package]
name = "anvil-ttf"
version = "0.8.0"
edition = "2024"
authors = ["Buntato <324143321+buntatoes@users.noreply.github.com>"]
license = "MPL-2.0"
description = "TrueType and OpenType parser, glyph outlines, and a coverage rasterizer."
repository = "https://github.com/buntatoes/anvil-ttf"
homepage = "https://github.com/buntatoes/anvil-ttf"
readme = "README.md"
keywords = ["truetype", "opentype", "font", "ttf"]
categories = ["parser-implementations", "rendering"]
publish = false
